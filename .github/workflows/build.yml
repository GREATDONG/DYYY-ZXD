name: Build DYYY .deb

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.0'

      - name: Install Theos
        run: |
          brew install ldid make
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Download SDKs
        run: |
          git clone https://github.com/theos/sdks.git
          mv sdks/iPhoneOS16.5.sdk $HOME/theos/sdks/iPhoneOS16.5.sdk || true

      - name: Create project structure
        run: |
          mkdir -p layout/DEBIAN
          mkdir -p layout/Library/MobileSubstrate/DynamicLibraries
          mkdir -p layout/var/mobile/Library/PreferenceBundles/DYYY.bundle
          mkdir -p layout/var/mobile/Library/PreferenceLoader/Preferences/DYYY

      - name: Create control file
        run: |
          cat > layout/DEBIAN/control << 'EOF'
          Package: com.huami.dyyy
          Name: DYYY
          Depends: mobilesubstrate
          Version: 2.0.0
          Architecture: iphoneos-arm64
          Description: 抖音增强插件 - 优化版
          Maintainer: huami
          Author: huami
          Section: Tweaks
          EOF

      - name: Create plist
        run: |
          cat > layout/Library/MobileSubstrate/DynamicLibraries/DYYY.plist << 'EOF'
          { Filter = { Bundles = ( "com.ss.iphone.ugc.Aweme" ); }; }
          EOF

      - name: Build dylib (simulated)
        run: |
          echo "注意: 需要完整的 DYYY 源码才能构建"
          echo "当前仅创建项目结构"
          
          cat > layout/Library/MobileSubstrate/DynamicLibraries/DYYY.dylib << 'EOF'
          This is a placeholder.
          You need to build from complete DYYY source code.
          EOF

      - name: Package .deb
        run: |
          dpkg-deb -Zgzip -b layout DYYY_2.0.0_iphoneos-arm64.deb || true
          ls -la *.deb || echo "需要完整源码才能构建"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DYYY-deb
          path: |
            *.deb
            layout/
          retention-days: 30
