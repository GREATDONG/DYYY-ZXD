name: build deb

on:
  push:
    branches-ignore:
      - dev
  pull_request:
    branches-ignore:
      - dev

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: macos-14
    environment:
      name: production
      url: https://github.com/GREATDONG/DYYY-ZXD

    steps:
      - uses: actions/checkout@v4

      - name: Check cache
        run: |
          echo upstream_heads=`git ls-remote https://github.com/roothide/theos | head -n 1 | cut -f 1`-`git ls-remote https://github.com/theos/sdks | head -n 1 | cut -f 1` >> $GITHUB_ENV

      - name: Use cache
        id: cache
        uses: actions/cache@v4.2.1
        with:
          path: ${{ github.workspace }}/theos
          key: ${{ runner.os }}-${{ env.upstream_heads }}

      - name: Prepare Theos
        uses: huami1314/theos-action@main

      - name: Setup GNU Make
        run: |
          echo "$(brew --prefix)/opt/make/libexec/gnubin" >> $GITHUB_PATH

      - name: Build package (Standard)
        run: |
          rm -f packages/*
          make package FINALPACKAGE=1 -j$(sysctl -n hw.ncpu)

      - name: Build Rootless variant
        run: |
          make package SCHEME=rootless FINALPACKAGE=1 -j$(sysctl -n hw.ncpu)

      - name: Build RootHide variant
        run: |
          make package SCHEME=roothide FINALPACKAGE=1 -j$(sysctl -n hw.ncpu)

      - name: List packages
        run: |
          ls -la packages/

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: DYYY-packages
          path: ${{ github.workspace }}/packages/*.deb
